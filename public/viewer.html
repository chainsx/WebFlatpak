<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'">
  <title>StrataOS Application Viewer</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/webapp-controls.css">
</head>
<body class="viewer-page">
  <header class="viewer-window-header"><div><p class="eyebrow">STRATAOS APPLICATION CENTER</p><h1 id="viewer-title">Application Viewer</h1><p id="viewer-status">Connecting to graphical session</p></div><div class="viewer-controls"><label for="aspect-ratio">Aspect ratio</label><select id="aspect-ratio"><option value="auto">Fit window</option><option value="16/9">16:9</option><option value="16/10">16:10</option><option value="4/3">4:3</option><option value="3/2">3:2</option><option value="21/9">21:9</option></select><label for="resolution">Resolution</label><select id="resolution"><option value="adaptive">Adaptive</option><option value="1280x720">1280 x 720</option><option value="1600x900">1600 x 900</option><option value="1920x1080">1920 x 1080</option></select><label for="quality">Quality</label><select id="quality"><option value="balanced">Balanced</option><option value="high">High</option><option value="best">Best</option></select><button id="reconnect" class="secondary">Reconnect</button></div></header>
  <main class="viewer-window"><div id="screen"></div></main>
  <script type="module" src="/viewer.js"></script>
</body>
</html>
