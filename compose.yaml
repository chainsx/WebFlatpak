services:
  webflatpak:
    build:
      context: .
    environment:
      WEBFLATPAK_USERNAME: ${WEBFLATPAK_USERNAME:-admin}
      WEBFLATPAK_PASSWORD: ${WEBFLATPAK_PASSWORD:?Set WEBFLATPAK_PASSWORD in .env}
    ports:
      - "8080:8080"
    privileged: true
    volumes:
      - webflatpak-data:/var/lib/webflatpak
    restart: unless-stopped

volumes:
  webflatpak-data:
